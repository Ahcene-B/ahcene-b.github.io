<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url == "/" %}Ahcène Boubekki{% else %}{{ page.title | capitalize }}, Ahcène Boubekki{% endif %}</title>
<meta name="description" content="{{ page.description | default: 'Ahcène Boubekki, postdoctoral researcher at the University of Copenhagen and the Pioneer Centre for AI.' }}">
<script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="{{ '/assets/css/plain.css' | relative_url }}">
</head>
<body>
{% include bar.html %}
<main{% if page.main_class %} class="{{ page.main_class }}"{% else %} class="wrap page"{% endif %}>
{{ content }}
</main>
<footer>
  <div class="wrap">
    <span>© {{ site.time | date: "%Y" }} Ahcène Boubekki</span>
    <a href="mailto:ahcene.boubekki@proton.me">ahcene.boubekki@proton.me</a>
  </div>
</footer>
<script src="{{ '/assets/js/plain.js' | relative_url }}" defer></script>
{% if page.demo %}<script src="{{ '/assets/js/nave-demo.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
